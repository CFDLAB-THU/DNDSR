# CI: configure, build, and run the requested cumulative test level.
#
# Triggers:
#   workflow_dispatch            — manual, any branch
#   issue_comment               — when a maintainer comments /ci-run or
#                                 /ci-run-self-hosted on a PR
#
# Runner selection:
#   A lightweight "resolve" job picks the runner and feature flags so that
#   only ONE "build-and-test" job is launched (no wasted matrix entries).
#
#   github      — Ubuntu 24.04, ephemeral, uses actions/setup-python + ccache
#   self-hosted — self-hosted Docker container, system python3, no sudo, persistent ccache
#
# Test matrix:
#   - C++ unit tests (doctest + ctest)
#   - Python tests (pytest + pytest-mpi)
#
# External data:
#   - harryzhou2000/cfd_meshes   → checked out into data/mesh/

name: CI

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to use"
        type: choice
        options:
          - github
          - self-hosted
        default: github
      test_level:
        description: "Test level (0 critical, 1 extended, 2 full)"
        type: choice
        options: ['0', '1', '2']
        default: '0'
  issue_comment:
    types: [created]

env:
  # Bump when a workflow or runner change affects dependency or venv artifacts.
  CI_CACHE_VERSION: v3
  HEADERONLYS_URL: https://github.com/harryzhou2000/cfd_externals_headeronlys/releases/download/v0.3.0/external_headeronlys.tar.gz
  HEADERONLYS_SHA256: 00692e1581f900d76c43432f4712b8dc2a53408d968fbf656bd3dd3561e2514e
  OMPI_MCA_rmaps_base_oversubscribe: "1"

jobs:
  # ------------------------------------------------------------------
  # Resolve which runner and feature flags to use.
  # Outputs are consumed by the single build-and-test job below.
  # ------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/ci-run-self-hosted') ||
        contains(github.event.comment.body, '/ci-run')))
    outputs:
      runs-on: ${{ steps.pick.outputs.runs_on }}
      use-ccache: ${{ steps.pick.outputs.use_ccache }}
      cache-ccache: ${{ steps.pick.outputs.cache_ccache }}
      ccache-dir: ${{ steps.pick.outputs.ccache_dir }}
      setup-python: ${{ steps.pick.outputs.setup_python }}
      install-sys-deps: ${{ steps.pick.outputs.install_sys_deps }}
      pr-sha: ${{ steps.pick.outputs.pr_sha }}
      test-level: ${{ steps.pick.outputs.test_level }}
      cache-profile: ${{ steps.pick.outputs.cache_profile }}
    steps:
      - name: Check write permission
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const level = perm.permission;  // admin, write, read, none
            if (level !== 'admin' && level !== 'write') {
              core.setFailed(`User ${context.payload.comment.user.login} has '${level}' permission, need 'write' or 'admin' to trigger CI.`);
            }

      - name: Pick runner
        id: pick
        uses: actions/github-script@v7
        with:
          script: |
            let runner = 'github';
            let testLevel = '0';
            let prSha = '';

            if (context.eventName === 'workflow_dispatch') {
              runner = context.payload.inputs?.runner || 'github';
              testLevel = context.payload.inputs?.test_level || '0';
            } else {
              const command = (context.payload.comment.body || '').trim();
              const match = command.match(/^\/ci-run(-self-hosted)?(?:[ \t]+([012]|full))?$/);
              if (!match) {
                core.setFailed('Use /ci-run [0|1|2|full] or /ci-run-self-hosted [0|1|2|full].');
                return;
              }
              runner = match[1] ? 'self-hosted' : 'github';
              testLevel = match[2] === 'full' ? '2' : (match[2] || '0');

              // Get the PR head SHA for checkout
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              prSha = pr.data.head.sha;
            }

            if (!['github', 'self-hosted'].includes(runner) || !['0', '1', '2'].includes(testLevel)) {
              core.setFailed('Invalid CI runner or test level.');
              return;
            }
            core.setOutput('test_level', testLevel);
            core.setOutput('cache_profile', runner === 'github' ? 'ubuntu-24.04-py312' : 'self-hosted-linux');
            core.notice(`Test level ${testLevel} on ${runner} for ${prSha || context.sha}`);

            if (runner === 'self-hosted') {
              core.setOutput('runs_on', '["self-hosted","Linux","X64"]');
              core.setOutput('use_ccache', 'true');
              core.setOutput('cache_ccache', 'false');
              core.setOutput('ccache_dir', '/home/runner/.ccache');
              core.setOutput('setup_python', 'false');
              core.setOutput('install_sys_deps', 'false');
            } else {
              core.setOutput('runs_on', '"ubuntu-24.04"');
              core.setOutput('use_ccache', 'true');
              core.setOutput('cache_ccache', 'true');
              core.setOutput('ccache_dir', process.env.GITHUB_WORKSPACE + '/.ccache');
              core.setOutput('setup_python', 'true');
              core.setOutput('install_sys_deps', 'true');
            }
            core.setOutput('pr_sha', prSha);

  # ------------------------------------------------------------------
  # Single build-and-test job — runner chosen by the resolve job above.
  # ------------------------------------------------------------------
  build-and-test:
    needs: resolve
    runs-on: ${{ fromJSON(needs.resolve.outputs.runs-on) }}
    env:
      CCACHE_DIR: ${{ needs.resolve.outputs.ccache-dir }}
      DNDS_CI_LEVEL: ${{ needs.resolve.outputs.test-level }}
    steps:
      # ------------------------------------------------------------------
      # 1. Checkout source
      # ------------------------------------------------------------------
      - name: Checkout DNDSR
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.pr-sha || '' }}

      - name: Stage pinned test meshes
        run: bash scripts/ci_stage_meshes.sh "$DNDS_CI_LEVEL"

      # The submodule commit is tracked by the parent repo's tree object,
      # NOT by .gitmodules (which only stores URL/path).  Capture the
      # pinned SHA so cache keys invalidate when the submodule advances.
      - name: Get cfd_externals submodule commit
        id: submod
        run: echo "cfd_ext_sha=$(git rev-parse HEAD:external/cfd_externals)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 2. System packages (skipped if already present)
      # ------------------------------------------------------------------
      - name: Install system dependencies
        if: needs.resolve.outputs.install-sys-deps == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache doxygen \
            libopenmpi-dev openmpi-bin

      # ------------------------------------------------------------------
      # 3. Python interpreter (GitHub-hosted: actions/setup-python;
      #    self-hosted: use whatever python3 is available)
      # ------------------------------------------------------------------
      - name: Set up Python (GitHub-hosted)
        if: needs.resolve.outputs.setup-python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # 4. Clean cached directories so actions/cache is the sole source
      #    of truth (matters on self-hosted runners with persistent
      #    filesystems).  Must happen before cfd_externals build so the
      #    install/ directory is clean for caching.
      # ------------------------------------------------------------------
      - name: Clean cached directories
        run: |
          rm -rf external/argparse external/boost external/CGAL \
                 external/cccl external/cppcodec external/cpptrace external/doctest \
                 external/eigen external/exprtk external/fmt \
                 external/nanoflann external/nlohmann external/pybind11 \
                 external/pybind11_json external/spdlog external/doxygen-awesome-css
          rm -rf external/cfd_externals/install

      # ------------------------------------------------------------------
      # 4b. Fetch the source revision and its dependency requirements
      # ------------------------------------------------------------------
      - name: Initialize pinned externals
        run: git submodule update --init --depth=1 external/cfd_externals

      # ------------------------------------------------------------------
      # 5. Header-only externals (Eigen, Boost, CGAL, fmt, pybind11, ...)
      # ------------------------------------------------------------------
      - name: Restore header-only externals cache
        id: cache-headeronlys
        uses: actions/cache/restore@v4
        with:
          path: |
            external/argparse
            external/boost
            external/CGAL
            external/cccl
            external/cppcodec
            external/cpptrace
            external/doctest
            external/doxygen-awesome-css
            external/eigen
            external/exprtk
            external/fmt
            external/nanoflann
            external/nlohmann
            external/pybind11
            external/pybind11_json
            external/spdlog
          key: headeronlys-${{ env.HEADERONLYS_SHA256 }}

      - name: Download and extract header-only externals
        if: steps.cache-headeronlys.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o external/external_headeronlys.tar.gz "$HEADERONLYS_URL"
          echo "$HEADERONLYS_SHA256  external/external_headeronlys.tar.gz" | sha256sum --check -
          cd external && tar -xzf external_headeronlys.tar.gz

      - name: Verify header-only externals
        run: |
          for file in argparse/include/argparse/argparse.hpp boost/boost/version.hpp CGAL/include/CGAL/version.h \
                      cppcodec/base32_hex.hpp doctest/doctest.h eigen/eigen3.pc.in exprtk/exprtk.hpp fmt/CMakeLists.txt \
                      nanoflann/nanoflann.hpp nlohmann/nlohmann/json.hpp pybind11/CMakeLists.txt \
                      pybind11_json/include/pybind11_json/pybind11_json.hpp spdlog/include/spdlog/spdlog.h; do
            test -s "external/$file"
          done

      - name: Save header-only externals cache
        if: steps.cache-headeronlys.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external/argparse
            external/boost
            external/CGAL
            external/cccl
            external/cppcodec
            external/cpptrace
            external/doctest
            external/doxygen-awesome-css
            external/eigen
            external/exprtk
            external/fmt
            external/nanoflann
            external/nlohmann
            external/pybind11
            external/pybind11_json
            external/spdlog
          key: headeronlys-${{ env.HEADERONLYS_SHA256 }}

      # ------------------------------------------------------------------
      # 6. cfd_externals (zlib, hdf5, cgns, parmetis)
      # ------------------------------------------------------------------
      - name: Restore cfd_externals cache
        id: cache-cfd-ext
        uses: actions/cache/restore@v4
        with:
          path: external/cfd_externals/install
          key: cfd-ext-${{ env.CI_CACHE_VERSION }}-${{ needs.resolve.outputs.cache-profile }}-${{ steps.submod.outputs.cfd_ext_sha }}

      - name: Validate or build cfd_externals
        run: |
          prefix="$PWD/external/cfd_externals/install"
          if bash scripts/verify_ci_externals.sh "$prefix"; then
            exit 0
          fi
          rm -rf -- "$prefix"
          git submodule update --init --recursive --depth=1 external/cfd_externals
          bootstrap="$(mktemp -d)"
          trap 'rm -rf -- "$bootstrap"' EXIT
          python3 -m venv "$bootstrap/venv"
          source "$bootstrap/venv/bin/activate"
          python -m pip install -r external/cfd_externals/requirements.txt
          (cd external/cfd_externals && CC=mpicc CXX=mpicxx python cfd_externals_build.py --build-root "$bootstrap/build")
          bash scripts/verify_ci_externals.sh "$prefix"

      - name: Save cfd_externals cache
        if: steps.cache-cfd-ext.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external/cfd_externals/install
          key: cfd-ext-${{ env.CI_CACHE_VERSION }}-${{ needs.resolve.outputs.cache-profile }}-${{ steps.submod.outputs.cfd_ext_sha }}

      # ------------------------------------------------------------------
      # 7. Full Python environment (h5py against cfd_externals HDF5, etc.)
      # ------------------------------------------------------------------
      - name: Restore Python venv cache
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          path: venv
          key: venv-ci-${{ env.CI_CACHE_VERSION }}-${{ needs.resolve.outputs.cache-profile }}-${{ steps.submod.outputs.cfd_ext_sha }}-${{ hashFiles('requirements.txt', 'external/cfd_externals/requirements.txt', 'scripts/install_python_deps.sh') }}

      - name: Validate or install Python dependencies
        run: |
          valid_venv() {
            test -x venv/bin/python &&
              venv/bin/python -c 'import sys; print(sys.implementation.cache_tag)' | cmp -s - <(python3 -c 'import sys; print(sys.implementation.cache_tag)') &&
              venv/bin/python -c 'import h5py, pytest, pytest_mpi; from mpi4py import MPI; assert h5py.get_config().mpi'
          }
          if ! valid_venv; then
            rm -rf venv
            python3 -m venv venv
            source venv/bin/activate
            python -m pip install --upgrade pip
            PIP="$PWD/venv/bin/pip" MPI_CC=mpicc bash scripts/install_python_deps.sh
          fi
          valid_venv

      - name: Save Python venv cache
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: venv
          key: venv-ci-${{ env.CI_CACHE_VERSION }}-${{ needs.resolve.outputs.cache-profile }}-${{ steps.submod.outputs.cfd_ext_sha }}-${{ hashFiles('requirements.txt', 'external/cfd_externals/requirements.txt', 'scripts/install_python_deps.sh') }}

      # ------------------------------------------------------------------
      # 8. ccache
      # ------------------------------------------------------------------
      - name: Restore ccache
        if: needs.resolve.outputs.cache-ccache == 'true'
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ needs.resolve.outputs.ccache-dir }}
          key: ccache-${{ env.CI_CACHE_VERSION }}-${{ needs.resolve.outputs.cache-profile }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.CI_CACHE_VERSION }}-${{ needs.resolve.outputs.cache-profile }}-

      - name: Configure ccache
        if: needs.resolve.outputs.use-ccache == 'true'
        run: ccache --max-size=5G

      # ------------------------------------------------------------------
      # 9. CMake configure
      # ------------------------------------------------------------------
      - name: CMake configure
        run: |
          source venv/bin/activate
          CC=mpicc CXX=mpicxx cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDNDS_BUILD_TESTS=ON -DDNDS_TEST_LEVEL="$DNDS_CI_LEVEL" -DDNDS_USE_CUDA=OFF -DDNDS_USE_CANTERA=ON \
            -DDNDS_USE_OMP=ON -DDNDS_DIST_MT_USE_OMP=ON \
            -DPython_EXECUTABLE="$VIRTUAL_ENV/bin/python" \
            -DPython3_EXECUTABLE="$VIRTUAL_ENV/bin/python"
        env:
          DNDS_TEST_MPIEXTRA: "--oversubscribe --bind-to none"
          DNDS_TEST_NP_LIST: "1;2;4;8"

      # ------------------------------------------------------------------
      # 10. Build the selected test executables and binding dependencies
      # ------------------------------------------------------------------
      - name: Build selected test and Python targets
        run: |
          cmake --build build --target ci_tests --parallel "$(nproc)"

      - name: Show ccache stats
        if: needs.resolve.outputs.use-ccache == 'true'
        run: ccache --show-stats

      - name: Install pybind11 modules
        run: |
          source venv/bin/activate
          cmake --install build --component py

      # ------------------------------------------------------------------
      # 12. Run the selected CTest and pytest lanes once.
      # ------------------------------------------------------------------
      - name: Run selected tests
        timeout-minutes: 40
        run: bash scripts/run_ci_tests.sh "$DNDS_CI_LEVEL" build venv/bin/python
        env:
          DNDS_DIST_OMP_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
          OMPI_MCA_hwloc_base_binding_policy: "none"

      # ------------------------------------------------------------------
      # Always save ccache regardless of build/test outcome
      # (only on github-hosted — self-hosted persists ccache on disk)
      # ------------------------------------------------------------------
      - name: Save ccache
        if: >
          always() &&
          needs.resolve.outputs.cache-ccache == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ needs.resolve.outputs.ccache-dir }}
          key: ccache-${{ env.CI_CACHE_VERSION }}-${{ needs.resolve.outputs.cache-profile }}-${{ github.run_id }}
